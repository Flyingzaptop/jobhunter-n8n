  europe_nonlocal: {discover: true, hybrid_action: REJECT, onsite_action: REJECT}
  relocation: {enabled: false, assume_willing: false, allowed_countries: [], allowed_cities: []}
  unknown_work_format: {action: REVIEW}
application_domains: {allow: [], deny: []}

# User override: compensation never filters or ranks vacancies.
compensation_filter:
  enabled: false
  minimum: null
consent_policy:
  current_recruitment_data_processing: true
  authorization_source: USER_CHAT_2026-10-05
