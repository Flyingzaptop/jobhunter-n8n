policy_version: search-v2.1
thresholds: {auto_apply: 78, review: 60, stretch: 45}
qualification_weights:
  TECHNICAL: 40
  PROFESSIONAL_EXPERIENCE: 30
  EDUCATION: 20
  LANGUAGE: 10
  OTHER: 5
excluded_companies: []
excluded_countries: []
role_families:
  primary:
    - mechanical_engineering
    - mechanical_design
    - r_and_d
    - product_development
    - simulation_cae
    - test_validation
    - automotive
    - aerospace
    - robotics
    - automation
  software_data:
    - python
    - machine_learning
    - data_science
    - research_engineering
    - technical_software
    - scientific_software
    - embedded_software
    - graphics_performance
    - gamedev_technical
  bridge:
    - it_support
    - systems_administration
    - technical_support
    - deployment_automation
  cross_disciplinary:
    - mechanical_plus_software
    - simulation_plus_python
    - robotics_plus_software
    - test_plus_automation
    - digital_engineering
    - embedded_plus_mechanical
seniority:
  include: [internship, graduate, junior, entry_level, regular, mid]
  selective_mid: true
  reject_explicit_senior_when_materially_unqualified: true
work_location_policy:
  candidate_base: {city: Wroclaw, country: Poland}
  discovery:
    worldwide_remote: true
    europe_remote: true
    poland_remote: true
    wroclaw_local: true
    europe_hybrid: true
    europe_onsite: true
  remote:
    worldwide_from_poland: true
    europe_from_poland: true
    eu_from_poland: true
    emea_from_poland: true
    poland: true
  local:
    radius_km: 30
    hybrid_enabled: true
    onsite_discover: true
    onsite_auto_apply: false
  poland_nonlocal:
    rare_travel_enabled: true
    max_onsite_days_per_month_for_auto_apply: 1
    regular_hybrid_action: REVIEW
  europe_nonlocal: {discover: true, hybrid_action: REVIEW, onsite_action: REVIEW}
  relocation: {assume_willing: false, allowed_countries: [], allowed_cities: []}
  unknown_work_format: {action: REVIEW}
application_domains: {allow: [], deny: []}

# User override: compensation never filters or ranks vacancies.
compensation_filter:
  enabled: false
  minimum: null
