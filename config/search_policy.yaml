    europe_onsite: true
  remote:
    worldwide_from_poland: true
    europe_from_poland: true
    eu_from_poland: true
    emea_from_poland: true
    poland: true
  local:
    radius_km: 30
    hybrid_enabled: true
    onsite_discover: false
    onsite_auto_apply: false
  exclude_onsite: true
  poland_nonlocal:
    rare_travel_enabled: false
    max_onsite_days_per_month_for_auto_apply: 0
