    source_class: global_board
    discovery_capability: PUBLIC_FEED
    application_capability: MANUAL_TAKEOVER
    permitted_access: true
    allowed_hosts: *a1
    documentation: https://jobgether.com/astroapi/ai/jobs/docs
    robots_url: https://jobgether.com/robots.txt
    max_pages: 2
    min_scan_interval_ms: 21600000
    attribution_required: true
    query_plans:
      - query: All current listings
        geography: Worldwide
        parameters:
          limit: 25
      - query: mechanical engineer
        geography: Europe / Poland / worldwide
        parameters:
          keyword: mechanical
          locations: europe,anywhere
          includeHybrid: true
          limit: 25
      - query: automation robotics
        geography: Worldwide
        parameters:
          keyword: robotics
          includeHybrid: true
          limit: 25
      - query: Python ML data
        geography: Europe / Poland / worldwide
        parameters:
          keyword: Python
          locations: europe,anywhere
          limit: 25
      - query: scientific research engineering
        geography: Worldwide
        parameters:
          keyword: research engineer
          includeHybrid: true
          limit: 25
      - query: IT systems support
        geography: Europe / Poland / worldwide
        parameters:
          keyword: technical support
          locations: europe,anywhere
