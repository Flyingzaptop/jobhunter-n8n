services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
    restart: unless-stopped
  core:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobhunter}
      BROWSER_SERVICE_URL: http://browser:3001
      HOST: 0.0.0.0
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  browser:
    build: .
    command: [node, services/browser-service/server.mjs]
    env_file: .env
    environment:
      BIND_HOST: 0.0.0.0
      ARTIFACT_DIR: /app/data/cv
    volumes: [./data:/app/data]
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    ports: [127.0.0.1:5678:5678]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-jobhunter}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-jobhunter}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Warsaw
      TZ: Europe/Warsaw
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_PUBLIC_API_DISABLED: 'true'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  mock:
    build: .
    command: [node, services/mock-job-board/server.mjs]
    profiles: [test]
    environment:
      BIND_HOST: 0.0.0.0
      MOCK_TEST_MODE: 'true'
      MOCK_TEST_TOKEN: ${MOCK_TEST_TOKEN:-}
    ports: [127.0.0.1:3002:3002]
volumes:
  postgres_data:
  n8n_data:
